<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Four overlapping document icons, each labelled with a near-duplicate filename, the front one stamped CURRENT">
  <rect width="1600" height="720" fill="#f2ead9" />

  <!-- Copy of report (2).docx -->
  <g transform="translate(620,430) rotate(-14)">
    <path d="M -130 -170 L 95 -170 L 130 -135 L 130 170 L -130 170 Z" transform="translate(-4,-4)" fill="#f2ead9" stroke="#b97d1c" stroke-width="6" />
