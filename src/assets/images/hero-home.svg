    <line x1="-95" y1="-95" x2="70" y2="-95" stroke="#1a1613" stroke-width="9" stroke-linecap="round" opacity="0.5" />
    <line x1="-95" y1="-55" x2="45" y2="-55" stroke="#1a1613" stroke-width="9" stroke-linecap="round" opacity="0.4" />
    <text x="-125" y="148" font-family="'Courier New', Courier, monospace" font-size="26" fill="#1a1613">Untitled-3.docx</text>
  </g>

  <!-- final_v2.docx -->
  <g transform="translate(1000,440) rotate(-6)">
    <path d="M -130 -170 L 95 -170 L 130 -135 L 130 170 L -130 170 Z" transform="translate(-4,-4)" fill="#f2ead9" stroke="#b97d1c" stroke-width="6" />
    <path d="M -130 -170 L 95 -170 L 130 -135 L 130 170 L -130 170 Z" fill="#f2ead9" stroke="#1a1613" stroke-width="4" />
    <line x1="-95" y1="-95" x2="70" y2="-95" stroke="#1a1613" stroke-width="9" stroke-linecap="round" opacity="0.5" />
    <line x1="-95" y1="-55" x2="45" y2="-55" stroke="#1a1613" stroke-width="9" stroke-linecap="round" opacity="0.4" />
    <text x="-125" y="148" font-family="'Courier New', Courier, monospace" font-size="26" fill="#1a1613">final_v2.docx</text>
  </g>

  <!-- final_FINAL_revised2.docx (front) -->
  <g transform="translate(830,360) rotate(3)">
    <path d="M -130 -170 L 95 -170 L 130 -135 L 130 170 L -130 170 Z" transform="translate(-4,-4)" fill="#f2ead9" stroke="#b97d1c" stroke-width="6" />
    <path d="M -130 -170 L 95 -170 L 130 -135 L 130 170 L -130 170 Z" fill="#f2ead9" stroke="#1a1613" stroke-width="4" />
