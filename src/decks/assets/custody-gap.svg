<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="cg-title cg-desc">
  <title id="cg-title">A custody log, with its entries labelled by what supports them</title>
  <desc id="cg-desc">A chain of custody read backwards from now. Two entries are recorded by a system, two are inferred from residue, and one is unknown — an unbridged gap between the earliest inferred entry and the file's origin.</desc>

  <defs>
    <marker id="cg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8378" />
    </marker>
  </defs>

  <g font-family="Public Sans, sans-serif" font-size="17">
    <!-- now, recorded -->
    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="700" height="50" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="18" y="31" fill="#d8d4cc">you received it, 14 March, by email</text>
      <text x="682" y="31" fill="#8a8378" font-family="SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="end">recorded</text>
    </g>
    <line x1="390" y1="90" x2="390" y2="110" stroke="#8a8378" stroke-width="1.5" marker-end="url(#cg-arrow)" />

    <g transform="translate(40, 114)">
      <rect x="0" y="0" width="700" height="50" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="18" y="31" fill="#d8d4cc">forwarded by a colleague, same day</text>
      <text x="682" y="31" fill="#8a8378" font-family="SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="end">recorded</text>
    </g>
    <line x1="390" y1="164" x2="390" y2="184" stroke="#8a8378" stroke-width="1.5" marker-end="url(#cg-arrow)" />

    <!-- inferred -->
    <g transform="translate(40, 188)">
      <rect x="0" y="0" width="700" height="50" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" stroke-dasharray="6 5" />
      <text x="18" y="31" fill="#d8d4cc">edited in a fixed-layout tool &#8212; styles are flattened</text>
      <text x="682" y="31" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="end">inferred</text>
    </g>
    <line x1="390" y1="238" x2="390" y2="258" stroke="#8a8378" stroke-width="1.5" marker-end="url(#cg-arrow)" />

    <g transform="translate(40, 262)">
      <rect x="0" y="0" width="700" height="50" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" stroke-dasharray="6 5" />
      <text x="18" y="31" fill="#d8d4cc">copied to this machine &#8212; mtime precedes creation time</text>
      <text x="682" y="31" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="end">inferred</text>
    </g>

    <!-- the gap -->
    <g transform="translate(40, 326)">
      <rect x="0" y="0" width="700" height="44" rx="4" fill="none" stroke="#b97d1c" stroke-width="2" />
      <text x="18" y="29" fill="#b97d1c">before this: nothing. Stated as a gap, not filled in.</text>
      <text x="682" y="29" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15" text-anchor="end">unknown</text>
    </g>
  </g>
</svg>
