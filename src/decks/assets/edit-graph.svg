<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="edit-graph-title edit-graph-desc">
  <title id="edit-graph-title">A diff as a shortest path through an edit graph</title>
  <desc id="edit-graph-desc">A grid with the old file's lines along the top and the new file's lines down the side. Diagonal steps mark lines the two files share and cost nothing; horizontal steps are deletions and vertical steps are additions. A traced path runs from the top-left corner to the bottom-right.</desc>

  <defs>
    <marker id="eg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b97d1c" />
    </marker>
  </defs>

  <!-- column headings: file A -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="16" fill="#8a8378" text-anchor="middle">
    <text x="190" y="46">week 11</text>
    <text x="290" y="46">week 12</text>
    <text x="390" y="46">week 13</text>
  </g>
  <text x="190" y="24" font-family="Public Sans, sans-serif" font-size="14" fill="#b97d1c">v1.0 &#8594;</text>

  <!-- row headings: file B -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="16" fill="#8a8378" text-anchor="end">
    <text x="128" y="146">week 11</text>
    <text x="128" y="246">week 12</text>
  </g>
  <text x="60" y="96" font-family="Public Sans, sans-serif" font-size="14" fill="#b97d1c">v2.0 &#8595;</text>

  <!-- grid -->
  <g stroke="#4a453e" stroke-width="1">
    <line x1="140" y1="80" x2="440" y2="80" />
    <line x1="140" y1="180" x2="440" y2="180" />
    <line x1="140" y1="280" x2="440" y2="280" />
    <line x1="140" y1="80" x2="140" y2="280" />
    <line x1="240" y1="80" x2="240" y2="280" />
    <line x1="340" y1="80" x2="340" y2="280" />
    <line x1="440" y1="80" x2="440" y2="280" />
  </g>

  <!-- the path: horizontal (delete), horizontal (delete), diagonal (match) ... -->
  <g fill="none" stroke="#b97d1c" stroke-width="3" stroke-linecap="round">
    <path d="M 140 80 H 240" />
    <path d="M 240 80 H 340" />
    <path d="M 340 80 L 440 180" />
    <path d="M 440 180 V 280" marker-end="url(#eg-arrow)" />
  </g>

  <!-- nodes -->
  <g fill="#b97d1c">
    <circle cx="140" cy="80" r="5" />
    <circle cx="240" cy="80" r="5" />
    <circle cx="340" cy="80" r="5" />
    <circle cx="440" cy="180" r="5" />
    <circle cx="440" cy="280" r="5" />
  </g>

  <!-- legend -->
  <g font-family="Public Sans, sans-serif" font-size="17">
    <g transform="translate(500, 96)">
      <line x1="0" y1="0" x2="44" y2="0" stroke="#b97d1c" stroke-width="3" stroke-linecap="round" />
      <text x="58" y="6" fill="#d8d4cc">across &#8212; a deletion</text>
    </g>
    <g transform="translate(500, 146)">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#b97d1c" stroke-width="3" stroke-linecap="round" />
      <text x="58" y="6" fill="#d8d4cc">down &#8212; an addition</text>
    </g>
    <g transform="translate(500, 200)">
      <line x1="0" y1="-16" x2="34" y2="18" stroke="#b97d1c" stroke-width="3" stroke-linecap="round" />
      <text x="58" y="6" fill="#d8d4cc">diagonal &#8212; a line</text>
      <text x="58" y="28" fill="#d8d4cc">both files have</text>
    </g>
  </g>

  <g font-family="Public Sans, sans-serif" font-size="16" fill="#8a8378">
    <text x="140" y="330">Only the diagonal is free. The diff is the cheapest route</text>
    <text x="140" y="356">from one corner to the other, and it reports the steps</text>
    <text x="140" y="382">it took &#8212; not what any of them meant.</text>
  </g>
</svg>
