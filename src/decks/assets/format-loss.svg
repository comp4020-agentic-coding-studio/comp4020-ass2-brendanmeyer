<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="fl-title fl-desc">
  <title id="fl-title">What survives each step of a conversion chain</title>
  <desc id="fl-desc">Five properties — comments, revisions, styles, layout, and authored characters — tracked across DOCX, PDF, OCR and TXT. Each property is carried at first and drops out at some step, and none is ever restored by a later step.</desc>

  <g font-family="Public Sans, sans-serif" font-size="17" fill="#d8d4cc" text-anchor="end">
    <text x="176" y="106">comments</text>
    <text x="176" y="156">revisions</text>
    <text x="176" y="206">styles</text>
    <text x="176" y="256">layout</text>
    <text x="176" y="306">characters</text>
  </g>

  <!-- stage headings -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#b97d1c" text-anchor="middle">
    <text x="250" y="56">DOCX</text>
    <text x="400" y="56">PDF</text>
    <text x="550" y="56">OCR</text>
    <text x="700" y="56">TXT</text>
  </g>

  <!-- carried / dropped bars. carried = solid gold, dropped = faint dashes -->
  <g stroke-width="10" stroke-linecap="round" fill="none">
    <!-- comments: survives DOCX only -->
    <line x1="216" y1="100" x2="284" y2="100" stroke="#b97d1c" />
    <line x1="316" y1="100" x2="734" y2="100" stroke="#4a453e" stroke-dasharray="2 12" />

    <!-- revisions: DOCX only -->
    <line x1="216" y1="150" x2="284" y2="150" stroke="#b97d1c" />
    <line x1="316" y1="150" x2="734" y2="150" stroke="#4a453e" stroke-dasharray="2 12" />

    <!-- styles: DOCX full, PDF degraded (glyphs), then gone -->
    <line x1="216" y1="200" x2="284" y2="200" stroke="#b97d1c" />
    <line x1="366" y1="200" x2="434" y2="200" stroke="#8a5c13" />
    <line x1="466" y1="200" x2="734" y2="200" stroke="#4a453e" stroke-dasharray="2 12" />

    <!-- layout: DOCX flow, PDF fixed, then gone -->
    <line x1="216" y1="250" x2="284" y2="250" stroke="#b97d1c" />
    <line x1="366" y1="250" x2="434" y2="250" stroke="#b97d1c" />
    <line x1="466" y1="250" x2="734" y2="250" stroke="#4a453e" stroke-dasharray="2 12" />

    <!-- characters: authored, authored, guessed, guessed -->
    <line x1="216" y1="300" x2="284" y2="300" stroke="#b97d1c" />
    <line x1="366" y1="300" x2="434" y2="300" stroke="#b97d1c" />
    <line x1="516" y1="300" x2="584" y2="300" stroke="#8a5c13" />
    <line x1="666" y1="300" x2="734" y2="300" stroke="#8a5c13" />
  </g>

  <g font-family="Public Sans, sans-serif" font-size="14" fill="#8a8378" text-anchor="middle">
    <text x="400" y="222">glyphs</text>
    <text x="550" y="322">guessed</text>
    <text x="700" y="322">guessed</text>
  </g>

  <!-- legend -->
  <g font-family="Public Sans, sans-serif" font-size="15">
    <line x1="200" y1="356" x2="240" y2="356" stroke="#b97d1c" stroke-width="8" stroke-linecap="round" />
    <text x="252" y="362" fill="#8a8378">carried</text>
    <line x1="336" y1="356" x2="376" y2="356" stroke="#8a5c13" stroke-width="8" stroke-linecap="round" />
    <text x="388" y="362" fill="#8a8378">degraded</text>
    <line x1="490" y1="356" x2="530" y2="356" stroke="#4a453e" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 12" />
    <text x="542" y="362" fill="#8a8378">gone, and never restored</text>
  </g>
</svg>
