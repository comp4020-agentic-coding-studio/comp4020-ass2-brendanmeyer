<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="fg-title fg-desc">
  <title id="fg-title">One agreement, four copies, four grounds</title>
  <desc id="fg-desc">A single agreement at the centre, with four copies around it. Each copy is claimed as authoritative on a different ground: possession, position, recency and consensus. No ground outranks the others.</desc>

  <!-- centre -->
  <ellipse cx="390" cy="200" rx="104" ry="46" fill="none" stroke="#b97d1c" stroke-width="2" />
  <text x="390" y="194" font-family="Public Sans, sans-serif" font-size="19" fill="#e8e3d8" text-anchor="middle">one</text>
  <text x="390" y="220" font-family="Public Sans, sans-serif" font-size="19" fill="#e8e3d8" text-anchor="middle">agreement</text>

  <!-- spokes -->
  <g stroke="#4a453e" stroke-width="1.5">
    <line x1="316" y1="168" x2="248" y2="112" />
    <line x1="464" y1="168" x2="532" y2="112" />
    <line x1="316" y1="232" x2="248" y2="288" />
    <line x1="464" y1="232" x2="532" y2="288" />
  </g>

  <g font-family="Public Sans, sans-serif" font-size="17">
    <!-- top left -->
    <g transform="translate(20, 46)">
      <rect x="0" y="0" width="230" height="72" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" />
      <text x="16" y="28" fill="#d8d4cc" font-size="15">signed PDF, contract system</text>
      <text x="16" y="54" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15">possession</text>
    </g>
    <!-- top right -->
    <g transform="translate(530, 46)">
      <rect x="0" y="0" width="230" height="72" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" />
      <text x="16" y="28" fill="#d8d4cc" font-size="15">the DOCX legal is editing</text>
      <text x="16" y="54" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15">position</text>
    </g>
    <!-- bottom left -->
    <g transform="translate(20, 282)">
      <rect x="0" y="0" width="230" height="72" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" />
      <text x="16" y="28" fill="#d8d4cc" font-size="15">the version emailed at 4pm</text>
      <text x="16" y="54" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15">recency</text>
    </g>
    <!-- bottom right -->
    <g transform="translate(530, 282)">
      <rect x="0" y="0" width="230" height="72" rx="4" fill="none" stroke="#6b6154" stroke-width="1.5" />
      <text x="16" y="28" fill="#d8d4cc" font-size="15">the build delivery works from</text>
      <text x="16" y="54" fill="#b97d1c" font-family="SFMono-Regular, Consolas, monospace" font-size="15">consensus</text>
    </g>
  </g>

  <text x="390" y="380" font-family="Public Sans, sans-serif" font-size="16" fill="#8a8378" text-anchor="middle">Each holder can state a real ground. None of the four outranks the others by default.</text>
</svg>
