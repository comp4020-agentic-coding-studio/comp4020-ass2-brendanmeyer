<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="save-as-graph-title save-as-graph-desc">
  <title id="save-as-graph-title">A Save As chain drawn as a branch-and-merge graph</title>
  <desc id="save-as-graph-desc">essay_draft.docx leads to essay_draft_v2.docx, which branches: one line continues as John's edits, the other waits. The two rejoin at a node labelled MARISOL_MERGED. The merge edge is marked "claimed, not recorded".</desc>

  <defs>
    <marker id="sag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8378" />
    </marker>
    <marker id="sag-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b97d1c" />
    </marker>
  </defs>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="17">
    <!-- trunk -->
    <g>
      <rect x="30" y="24" width="250" height="44" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="46" y="52" fill="#d8d4cc">essay_draft.docx</text>
    </g>
    <line x1="155" y1="68" x2="155" y2="104" stroke="#8a8378" stroke-width="1.5" marker-end="url(#sag-arrow)" />

    <g>
      <rect x="30" y="108" width="250" height="44" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="46" y="136" fill="#d8d4cc">essay_draft_v2.docx</text>
    </g>

    <!-- branch out to John -->
    <path d="M 280 130 H 400 V 196" fill="none" stroke="#8a8378" stroke-width="1.5" marker-end="url(#sag-arrow)" />
    <g>
      <rect x="330" y="200" width="400" height="44" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="346" y="228" fill="#d8d4cc">..._v2_JOHN_EDITS.docx</text>
    </g>

    <!-- trunk continues down, waiting -->
    <path d="M 155 152 V 300" fill="none" stroke="#8a8378" stroke-width="1.5" stroke-dasharray="5 5" />

    <!-- merge join -->
    <path d="M 400 244 V 280 H 260" fill="none" stroke="#b97d1c" stroke-width="1.5" />
    <path d="M 155 300 H 260" fill="none" stroke="#b97d1c" stroke-width="1.5" opacity="0" />
    <path d="M 260 280 V 300 H 300" fill="none" stroke="#b97d1c" stroke-width="1.5" />
    <path d="M 155 300 H 300" fill="none" stroke="#b97d1c" stroke-width="1.5" />
    <path d="M 300 300 V 328" fill="none" stroke="#b97d1c" stroke-width="1.5" marker-end="url(#sag-arrow-gold)" />

    <text x="316" y="296" fill="#b97d1c" font-size="15">merge</text>

    <g>
      <rect x="80" y="332" width="600" height="44" rx="4" fill="none" stroke="#b97d1c" stroke-width="1.5" />
      <text x="96" y="360" fill="#e8e3d8">..._v2_JOHN_EDITS_MARISOL_MERGED.docx</text>
    </g>
  </g>

  <g font-family="Public Sans, sans-serif" font-size="15" fill="#8a8378">
    <text x="416" y="130">one file, two editors,</text>
    <text x="416" y="152">one merge event</text>
    <text x="470" y="360">claimed, not recorded</text>
  </g>
</svg>
