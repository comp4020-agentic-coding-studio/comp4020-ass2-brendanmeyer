<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="wemi-title wemi-desc">
  <title id="wemi-title">Four levels where a filesystem has one</title>
  <desc id="wemi-desc">The cataloguing model separates a creation into work, expression, manifestation and item, each realised or embodied in the next. Beside it, the filesystem's single level: a file.</desc>

  <defs>
    <marker id="wemi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8378" />
    </marker>
  </defs>

  <text x="40" y="40" font-family="Public Sans, sans-serif" font-size="17" fill="#b97d1c">cataloguing</text>

  <g font-family="Public Sans, sans-serif" font-size="19">
    <g transform="translate(40, 58)">
      <rect x="0" y="0" width="330" height="56" rx="4" fill="none" stroke="#b97d1c" stroke-width="1.5" />
      <text x="20" y="34" fill="#e8e3d8">work</text>
      <text x="310" y="34" fill="#8a8378" font-size="15" text-anchor="end">the creation itself</text>
    </g>
    <g transform="translate(40, 138)">
      <rect x="0" y="0" width="330" height="56" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="20" y="34" fill="#d8d4cc">expression</text>
      <text x="310" y="34" fill="#8a8378" font-size="15" text-anchor="end">one realisation</text>
    </g>
    <g transform="translate(40, 218)">
      <rect x="0" y="0" width="330" height="56" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="20" y="34" fill="#d8d4cc">manifestation</text>
      <text x="310" y="34" fill="#8a8378" font-size="15" text-anchor="end">one published form</text>
    </g>
    <g transform="translate(40, 298)">
      <rect x="0" y="0" width="330" height="56" rx="4" fill="none" stroke="#8a8378" stroke-width="1.5" />
      <text x="20" y="34" fill="#d8d4cc">item</text>
      <text x="310" y="34" fill="#8a8378" font-size="15" text-anchor="end">the copy on the shelf</text>
    </g>
  </g>

  <g stroke="#8a8378" stroke-width="1.5" fill="none">
    <line x1="205" y1="114" x2="205" y2="134" marker-end="url(#wemi-arrow)" />
    <line x1="205" y1="194" x2="205" y2="214" marker-end="url(#wemi-arrow)" />
    <line x1="205" y1="274" x2="205" y2="294" marker-end="url(#wemi-arrow)" />
  </g>

  <!-- divider -->
  <line x1="440" y1="40" x2="440" y2="360" stroke="#4a453e" stroke-width="1" stroke-dasharray="4 6" />

  <text x="500" y="40" font-family="Public Sans, sans-serif" font-size="17" fill="#b97d1c">filesystem</text>

  <g transform="translate(500, 178)">
    <rect x="0" y="0" width="240" height="56" rx="4" fill="none" stroke="#b97d1c" stroke-width="2" />
    <text x="20" y="35" font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#e8e3d8">a file</text>
  </g>

  <g font-family="Public Sans, sans-serif" font-size="16" fill="#8a8378">
    <text x="500" y="278">Four words because one</text>
    <text x="500" y="300">could not carry it.</text>
    <text x="500" y="336" fill="#b97d1c">The filesystem has one.</text>
  </g>
</svg>
